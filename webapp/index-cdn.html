<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8" />

		<title>SAP-Dashboard</title>

		<!-- Preload the logo image for immediate display on the login screen -->
		<link rel="preload" href="img/Logo_Uni_Goettingen_2022.png" as="image" />

		<script
			id="sap-ui-bootstrap"
			src="https://ui5.sap.com/1.146.0/resources/sap-ui-core.js"
			data-sap-ui-resource-roots='{
				"de.unigoettingen.dashboardapp": "./"
			}'
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
			data-sap-ui-compat-version="edge"
			data-sap-ui-frame-options="trusted"
			data-sap-ui-async="true"
		></script>
	</head>

	<body class="sapUiBody">
 		<div data-sap-ui-component data-name="de.unigoettingen.dashboardapp"></div>
 	</body>
</html>
